<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta content="#F9F8FC" name="theme-color"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<title>PATHOS Thumbnail Studio</title>
<style>
:root{
  color-scheme: light;
  /* NOIRU-derived editor UI tokens */
  --ui-bg:#F9F8FC;
  --ui-surface:#FFFFFF;
  --ui-surface-2:#F5F3F9;
  --ui-hover:#FAF8FD;
  --ui-border:#E8E9F0;
  --ui-border-soft:#F0EEF4;
  --ui-text:#2B2F36;
  --ui-muted:#5C6171;
  --ui-dim:#A5A9B4;
  --ui-accent:#ABED00;
  --ui-accent-strong:#8DBE00;
  --ui-accent-soft:#E8FFAE;
  --r-xl:24px;
  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
  --r-pill:999px;
  --shadow-soft:0 1px 2px rgba(43,47,54,.03),0 2px 8px rgba(43,47,54,.04);
  --shadow-card:0 2px 12px rgba(43,47,54,.05);
  --shadow-cta:0 6px 20px rgba(171,237,0,.22);
  --easing:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
[hidden]{display:none!important}
html,body{min-height:100%;background:var(--ui-bg);color:var(--ui-text);font-family:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
body{min-height:100dvh;overflow-x:hidden;overscroll-behavior:none;background-image:radial-gradient(ellipse 800px 500px at 100% 0%,rgba(233,230,247,.55),transparent 60%),radial-gradient(ellipse 700px 600px at 0% 100%,rgba(220,227,238,.38),transparent 65%);padding-bottom:env(safe-area-inset-bottom,0)}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(141,190,0,.55);outline-offset:2px}

.app{max-width:1460px;margin:0 auto;padding:18px 20px 36px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:26px;height:26px;border-radius:9px;background:var(--ui-accent);display:grid;place-items:center;color:#111;font-size:12px;font-weight:900;box-shadow:var(--shadow-soft)}
.brand-copy{min-width:0}
.brand-title{font-size:14px;line-height:1.2;font-weight:700;letter-spacing:.06em}
.brand-sub{font-size:10px;color:var(--ui-muted);letter-spacing:.12em;margin-top:3px;text-transform:uppercase}
.top-actions{display:flex;align-items:center;gap:8px}
.ghost-btn,.primary-btn{border:1px solid var(--ui-border);border-radius:var(--r-pill);height:38px;padding:0 14px;background:rgba(255,255,255,.86);color:var(--ui-text);font-size:12px;font-weight:650;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow-soft);transition:.18s var(--easing)}
.ghost-btn:hover{background:#fff;border-color:#DDE0E8}.ghost-btn:disabled{opacity:.38;cursor:default;background:rgba(255,255,255,.72)}
.primary-btn{background:var(--ui-accent);border-color:var(--ui-accent);color:#111;box-shadow:var(--shadow-cta)}
.primary-btn:hover{filter:brightness(.97)}
.primary-btn svg,.ghost-btn svg{width:14px;height:14px;flex:0 0 auto}

.editor-columns{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px 32px;align-items:start}
.editor-left{position:sticky;top:16px;align-self:start;min-width:0}
.editor-right{min-width:0}

.mobile-preview-toolbar{display:none}.mobile-brand{display:flex;align-items:center;gap:8px;min-width:0}.mobile-brand-mark{width:24px;height:24px;display:grid;place-items:center;flex:0 0 auto}.mobile-brand-mark svg{display:block;width:24px;height:24px}.mobile-brand-title{font-size:11px;font-weight:700;letter-spacing:.045em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview-card{background:rgba(255,255,255,.88);border:1px solid var(--ui-border);border-radius:var(--r-xl);padding:14px;box-shadow:var(--shadow-card);backdrop-filter:blur(10px)}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 12px}
.preview-title{font-size:12px;font-weight:700;letter-spacing:.04em}
.preview-meta{display:flex;align-items:center;gap:8px;color:var(--ui-muted);font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.preview-dot{width:7px;height:7px;border-radius:50%;background:var(--ui-accent);box-shadow:0 0 0 4px rgba(171,237,0,.14)}
.stage-viewport{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:16px;background:#E9E9E5;box-shadow:inset 0 0 0 1px rgba(17,17,17,.04);contain:layout paint;min-width:0}
.stage-viewport>.stage{will-change:transform}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#ABED00;color:#111;visibility:visible;transform:scale(.5)}
.stage-bg-square{position:absolute;inset:72px;border-radius:28px;background:#F6F6F2}
.stage-bg-circle-fill,.stage-bg-circle-outline{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%)}
.stage-bg-circle-fill{width:1540px;height:1540px;background:#F6F6F2}
.stage-bg-circle-outline{width:1640px;height:1640px;border:8px solid #F6F6F2}
.stage-safe{position:absolute;inset:72px;z-index:2;pointer-events:none;--safe-x:32px;--safe-y:40px;--logo-gap:32px;--logo-reserve:0px}
.copy-zone{position:absolute;left:var(--safe-x);right:var(--safe-x);top:var(--safe-y);bottom:calc(var(--safe-y) + var(--logo-reserve));min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center}
.copy-wrap{position:relative;width:100%;max-width:1280px}
.copy-stack{display:flex;flex-direction:column;align-items:center;width:100%}
.point-label{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:var(--point-height,72px);padding:0 var(--point-pad-x,38px);margin:0 0 var(--point-gap,32px);border-radius:var(--point-radius,32px);background:#ABED00;color:#111;font-size:var(--point-size,36px);font-weight:800;line-height:1;letter-spacing:.04em;white-space:nowrap;flex:0 0 auto}
.point-label[hidden]{display:none}
.point-text{display:block;line-height:1;position:relative;z-index:2}
.point-bracket{display:none;line-height:1;position:relative;z-index:2}
.point-tail{display:none;position:absolute;left:22%;bottom:-18px;width:26px;height:22px;background:inherit;clip-path:polygon(0 0,100% 0,0 100%)}
.point-label[data-style="bracket"]{min-height:auto;padding:0;background:transparent!important;border-radius:0!important;gap:.06em}
.point-label[data-style="bracket"] .point-bracket{display:inline-block}
.point-label[data-style="speech"] .point-tail{display:block}
.title-lines{display:flex;flex-direction:column;align-items:center;gap:var(--title-line-gap,6px);font-weight:700;line-height:1.18;letter-spacing:.018em;width:100%}
.title-line{display:flex;flex-direction:column;align-items:center;width:max-content;max-width:100%;white-space:nowrap}
.title-text{display:block;line-height:1.18;white-space:nowrap}
.title-underline{display:block;width:100%;height:var(--underline-height,8px);margin-top:var(--underline-gap,14px);background:#ABED00;flex:0 0 auto}
.subtitle-lines{margin-top:var(--title-subtitle-gap,42px);display:flex;flex-direction:column;align-items:center;gap:var(--subtitle-line-gap,4px);font-weight:600;line-height:1.35;letter-spacing:.028em;width:100%}
.subtitle-line{display:block;width:max-content;max-width:100%;white-space:nowrap}
.subtitle-text{display:block;line-height:1.35;white-space:nowrap}
.logo-zone{position:absolute;left:var(--safe-x);right:var(--safe-x);bottom:40px;display:flex;justify-content:center;align-items:flex-end;min-height:1px;z-index:3}
.logo-wrap{width:190px;line-height:0;display:flex;justify-content:center;align-items:flex-end}
.logo-wrap svg,.logo-wrap img{display:block;max-width:100%;max-height:72px;width:100%;height:auto;object-fit:contain}
.logo-wrap svg path,.logo-wrap svg polygon:not([fill]){fill:currentColor}
.logo-wrap svg polygon[fill="#ABED00"]{fill:#ABED00}

.status-row{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:10px 2px 0}
.zoom-controls{display:flex;align-items:center;gap:6px;color:var(--ui-muted);font:10px ui-monospace,SFMono-Regular,Menlo,monospace}
.icon-btn{width:30px;height:30px;border:1px solid var(--ui-border);border-radius:50%;background:#fff;color:var(--ui-muted);display:grid;place-items:center}.icon-btn svg{width:14px;height:14px;stroke:currentColor}

.panel-card{background:rgba(255,255,255,.9);border:1px solid var(--ui-border);border-radius:var(--r-xl);box-shadow:var(--shadow-card);overflow:hidden;backdrop-filter:blur(10px)}
.phase-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border-bottom:1px solid var(--ui-border-soft);background:rgba(249,248,252,.8)}
.phase-tab{height:38px;border:0;background:transparent;border-radius:12px;color:var(--ui-muted);font-size:11px;font-weight:700;letter-spacing:.03em;transition:.18s var(--easing)}
.phase-tab.active{background:var(--ui-surface);color:var(--ui-text);box-shadow:var(--shadow-soft)}
.panel-scroll{max-height:calc(100dvh - 120px);overflow:auto;padding:0 16px 18px;scrollbar-width:thin;scrollbar-color:#D9DDE6 transparent}
.tab-panel{display:none}.tab-panel.active{display:block}

.tuning-group{border-top:1px solid var(--ui-border-soft)}
.tuning-group:last-child{border-bottom:1px solid var(--ui-border-soft)}
.tuning-head{width:100%;border:0;background:transparent;padding:14px 2px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ui-text);letter-spacing:.02em;-webkit-tap-highlight-color:transparent}
.tuning-label{display:inline-flex;align-items:center;gap:8px}.tuning-icon{width:18px;height:18px;display:grid;place-items:center;color:var(--ui-muted);flex:0 0 auto}.tuning-icon svg{width:16px;height:16px;display:block;stroke:currentColor}.tuning-icon.type-icon{font-size:13px;font-weight:700;letter-spacing:-.04em;font-family:ui-sans-serif,system-ui,sans-serif}
.tuning-right{display:inline-flex;align-items:center;gap:7px;color:var(--ui-muted)}
.close-label{font-size:10px;font-weight:500;letter-spacing:.06em;display:none}.tuning-group.open .close-label{display:inline;color:var(--ui-accent-strong)}
.chev{width:17px;height:17px;display:grid;place-items:center;transition:.2s var(--easing)}.chev svg{width:17px;height:17px;stroke:currentColor}.tuning-group.open .chev{transform:rotate(180deg);color:var(--ui-accent-strong)}
.tuning-body{max-height:0;overflow:hidden;padding:0 2px;transition:max-height .28s var(--easing),padding .28s var(--easing),border .28s var(--easing),background .28s var(--easing)}
.tuning-group.open .tuning-body{max-height:1200px;padding:10px 10px 14px;border-top:1px dashed var(--ui-border-soft);background:var(--ui-surface-2);border-radius:0 0 var(--r-md) var(--r-md);margin:0 -6px}

.field{display:flex;flex-direction:column;gap:7px;margin:0 0 14px}.field:last-child{margin-bottom:0}
.field-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.field-label{font-size:11px;font-weight:650;color:var(--ui-text)}
.param-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.param-actions{display:inline-flex;align-items:center;gap:6px}
.param-reset{width:28px;height:28px;background:transparent;border:none;color:var(--ui-dim);display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:var(--r-sm);transition:all .2s var(--easing);-webkit-tap-highlight-color:transparent}
.param-reset:hover{color:var(--ui-accent-strong);background:rgba(171,237,0,.08)}
.param-reset svg{width:13px;height:13px;stroke:currentColor}

.field-help{font-size:9.5px;color:var(--ui-dim);line-height:1.5}

.textarea,.text-input{width:100%;border:1px solid var(--ui-border);background:#fff;color:var(--ui-text);border-radius:12px;padding:10px 11px;font-size:13px;line-height:1.55;resize:vertical;min-height:44px;transition:border .15s var(--easing),box-shadow .15s var(--easing)}
.textarea:focus,.text-input:focus{outline:none;border-color:#C5D995;box-shadow:0 0 0 3px rgba(171,237,0,.12)}
.textarea{min-height:74px}
.range-row{display:grid;grid-template-columns:28px minmax(0,1fr) 28px 58px 28px;gap:7px;align-items:center}
input[type=range]{appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#DCE0E7;border-radius:999px}
input[type=range]::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #8DBE00;margin-top:-7px;box-shadow:0 1px 4px rgba(43,47,54,.18)}
.number-input{height:34px;width:58px;border:1px solid var(--ui-border);border-radius:10px;background:#fff;text-align:center;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ui-text)}
.slider-step{width:28px;height:28px;border:1px solid var(--ui-border);border-radius:9px;background:#fff;color:var(--ui-muted);display:grid;place-items:center;padding:0;transition:.16s var(--easing);-webkit-tap-highlight-color:transparent}
.slider-step svg{width:13px;height:13px;stroke:currentColor}.slider-step:hover{color:var(--ui-accent-strong);border-color:#C8D99A;background:#FBFDF5}.slider-step:active{transform:scale(.95)}.slider-step:disabled{opacity:.3;cursor:default;transform:none}
.palette-section{margin-top:16px;padding-top:14px;border-top:1px dashed var(--ui-border-soft)}
.palette-strip{display:flex;align-items:center;gap:8px;min-width:0;margin-top:8px}.palette-list{display:flex;align-items:center;gap:8px;min-width:0;overflow-x:auto;padding:4px 8px 6px 2px;scrollbar-width:thin}.palette-add{flex:0 0 34px;width:34px;height:34px;border:1px dashed #BEC3CD;border-radius:10px;background:#fff;color:var(--ui-muted);display:grid;place-items:center;padding:0}.palette-add svg{width:15px;height:15px}.palette-add:hover{border-color:#98B64D;color:var(--ui-accent-strong);background:#FBFDF5}.palette-item{position:relative;flex:0 0 34px;width:34px;height:34px}.palette-swatch{width:34px;height:34px;border-radius:10px;border:1px solid rgba(17,17,17,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);display:block;padding:0}.palette-delete{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border:0;border-radius:50%;background:#2B2F36;color:#fff;display:grid;place-items:center;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.2)}.palette-delete svg{width:9px;height:9px;stroke:currentColor}.palette-delete:hover{background:#111;transform:scale(1.08)}
.color-field.is-active{border-color:#9DBC4C;box-shadow:0 0 0 2px rgba(171,237,0,.12)}
.app-modal{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px}.app-modal.hidden{display:none}.app-modal-backdrop{position:absolute;inset:0;background:rgba(22,24,29,.34);backdrop-filter:blur(4px)}.app-modal-content{position:relative;width:min(380px,calc(100vw - 32px));background:#fff;border:1px solid var(--ui-border);border-radius:18px;box-shadow:0 22px 60px rgba(20,22,30,.18);overflow:hidden}.app-modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:1px solid var(--ui-border-soft)}.app-modal-title{margin:0;font-size:14px;font-weight:700}.app-modal-close{width:30px;height:30px;border:0;background:transparent;color:var(--ui-muted);display:grid;place-items:center;border-radius:8px}.app-modal-close svg{width:16px;height:16px}.app-modal-body{padding:18px 16px}.delete-preset-message{margin:0;font-size:13px;line-height:1.7;color:var(--ui-text)}.delete-preset-warning-notice{display:flex;align-items:center;gap:7px;margin:12px 0 0;color:#B64D49;font-size:10px}.delete-preset-warning-tag{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#B64D49;color:#fff;font-weight:800}.app-modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px}.app-modal-btn{height:42px;border-radius:12px;border:1px solid var(--ui-border);background:#fff;font-size:12px;font-weight:700}.app-modal-btn-danger{background:#2B2F36;border-color:#2B2F36;color:#fff}

.segment{display:grid;grid-template-columns:repeat(var(--count,2),1fr);gap:4px;padding:4px;border:1px solid var(--ui-border);border-radius:12px;background:#fff}
.segment button{height:34px;border:0;background:transparent;border-radius:9px;font-size:11px;font-weight:650;color:var(--ui-muted)}
.segment button.active{background:#F0F4E7;color:#111;box-shadow:inset 0 0 0 1px rgba(141,190,0,.24)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{position:relative;width:44px;height:26px;border-radius:999px;background:#D7DAE1;border:0;transition:.2s var(--easing)}
.switch::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(43,47,54,.18);transition:.2s var(--easing)}
.switch.on{background:var(--ui-accent-strong)}.switch.on::after{transform:translateX(18px)}
.color-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color-field{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--ui-border);background:#fff;border-radius:12px;padding:7px 8px;text-align:left;-webkit-tap-highlight-color:transparent}.color-field span{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ui-muted)}
.color-chip{width:26px;height:26px;border-radius:8px;border:1px solid rgba(17,17,17,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);flex:0 0 auto;background:#ABED00}
.color-accordion .tuning-label{gap:10px}.color-head-chip{width:18px;height:18px;border-radius:6px;border:1px solid rgba(17,17,17,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);flex:0 0 auto;background:#ABED00}.color-head-value{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ui-muted);font-weight:500}.inline-picker-host{width:100%}.inline-color-picker{display:flex;flex-direction:column;gap:16px}.picker-preview-row{display:flex;align-items:center;gap:12px}.picker-preview-swatch{width:46px;height:46px;border-radius:13px;border:1px solid rgba(17,17,17,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);background:#ABED00;flex:0 0 auto}.picker-preview-meta{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1 1 auto}.picker-preview-label{font-size:11px;font-weight:700;color:var(--ui-text)}.picker-hex{text-transform:uppercase;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.picker-main{display:grid;grid-template-columns:minmax(0,1fr) 26px;gap:10px;align-items:stretch}.sv-area{position:relative;aspect-ratio:1.45/1;border-radius:13px;overflow:hidden;touch-action:none;background:var(--picker-hue,#ff0000);border:1px solid rgba(17,17,17,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}.sv-area::before,.sv-area::after{content:"";position:absolute;inset:0}.sv-area::before{background:linear-gradient(to right,#fff,rgba(255,255,255,0))}.sv-area::after{background:linear-gradient(to top,#000,rgba(0,0,0,0))}.sv-thumb{position:absolute;width:18px;height:18px;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.45);transform:translate(-50%,-50%);z-index:3;pointer-events:none}.hue-area{position:relative;border-radius:999px;touch-action:none;background:linear-gradient(to bottom,#f00 0%,#ff0 16.66%,#0f0 33.33%,#0ff 50%,#00f 66.66%,#f0f 83.33%,#f00 100%);border:1px solid rgba(17,17,17,.08);min-height:170px}.hue-thumb{position:absolute;left:50%;width:32px;height:12px;border:3px solid #fff;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.38);transform:translate(-50%,-50%);z-index:2;pointer-events:none}.picker-rgb{display:grid;gap:10px}.picker-channel{display:grid;grid-template-columns:18px minmax(0,1fr) 56px;align-items:center;gap:10px}.picker-channel-label{font-size:11px;font-weight:700;color:var(--ui-muted);text-align:center}.picker-channel .number-input{width:56px}.picker-palette{padding-top:2px;border-top:1px dashed var(--ui-border-soft)}.picker-palette-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 8px}.picker-palette .palette-strip{margin-top:0}.picker-palette .palette-list{padding-right:8px}.picker-palette .palette-add{order:-1}.picker-palette-empty{font-size:10px;color:var(--ui-dim);padding:8px 0}.color-accordion.active-color .tuning-head{color:var(--ui-accent-strong)}
@media (max-width:899px){.picker-main{grid-template-columns:minmax(0,1fr) 24px}.sv-area{aspect-ratio:1.32/1}.hue-area{min-height:160px}.inline-color-picker{gap:14px}}
.upload{display:flex;flex-direction:column;gap:8px}.upload-btn{height:42px;border:1px dashed #C9CDD7;background:#fff;border-radius:12px;color:var(--ui-muted);font-size:11px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:7px}.upload-btn svg{width:14px;height:14px;stroke:currentColor;flex:0 0 auto}.upload-btn:hover{border-color:#9DB75C;color:var(--ui-text)}
.hidden-input{display:none}

  .mobile-save-btn svg{width:13px;height:13px;flex:0 0 auto}.mobile-toolbar-actions{display:flex;align-items:center;gap:6px}.mobile-history{width:32px;height:32px;border:1px solid var(--ui-border);border-radius:50%;background:#fff;color:var(--ui-muted);display:grid;place-items:center;box-shadow:var(--shadow-soft)}.mobile-history svg{width:14px;height:14px}.mobile-history:disabled{opacity:.35}.mobile-history:active{transform:translateY(1px)}
  .mobile-save-btn:active{transform:translateY(1px)}
  .preview-card{padding:8px;border-radius:18px}.preview-head{display:none}.stage-viewport{border-radius:12px}
  .status-row{display:none}
  .editor-right{margin-top:12px;scroll-margin-top:calc(var(--mobile-sticky-h,280px) + 8px)}
  .panel-card{border-radius:18px;box-shadow:none;background:rgba(255,255,255,.84)}
  .phase-tabs{display:none}.panel-scroll{max-height:none;overflow:visible;padding:0 14px 18px}
  .tab-panel{display:none}.tab-panel.active{display:block}
  .tuning-head{min-height:50px}.tuning-group.open .tuning-body{padding:12px 10px 16px}
  input[type=range]{height:34px}input[type=range]::-webkit-slider-thumb{width:20px;height:20px;margin-top:-8px}.range-row{grid-template-columns:24px minmax(0,1fr) 24px 52px 24px;gap:5px}.slider-step,.param-reset{width:24px;height:28px}.number-input{width:52px}
  /* NOIRU準拠: fixed bottom tabs + safe-area。activeは背景を足さず色だけで示す */
  .mobile-tabs{position:fixed;left:0;right:0;bottom:0;z-index:90;min-height:54px;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));display:flex;align-items:stretch;justify-content:space-around;background:var(--ui-surface);border-top:1px solid var(--ui-border-soft);box-shadow:0 -4px 20px rgba(20,22,30,.06);backdrop-filter:blur(16px)}

  .mobile-tab .tab-icon{width:19px;height:19px;line-height:1;display:grid;place-items:center;transition:transform .18s var(--easing)}
  .mobile-tab .tab-icon svg{width:19px;height:19px;stroke:currentColor}.mobile-tab .tab-icon.type-icon{font-size:14px;font-weight:700;letter-spacing:-.04em}
  .mobile-tab.active{color:var(--ui-accent-strong)}
  .mobile-tab.active .tab-icon{transform:translateY(-1px)}
  .toast{bottom:68px}
}

const defaults = {
  title:'タイトルを入力', subtitle:'補足を入力', pointText:'ポイントを入力', pointVisible:true,
  titleSize:80, subtitleSize:48, pointSize:40, pointStyle:'box', background:'square', pointRadius:32, underlineVisible:true,
  frameColor:'#ABED00', panelColor:'#F6F6F2', textColor:'#111111', accentColor:'#ABED00',
  logoWidth:192, logoVisible:true, logoKind:'default', logoData:null
};
let state = {...defaults};
let previewZoom = 1;
let lastFit = {title:80,subtitle:48,status:'ok'};
let historyStack=[];
let redoStack=[];
let historyLock=false;
const COLOR_PALETTE_KEY='pathos-thumbnail-color-palette-v2';
const LEGACY_COLOR_PALETTE_KEY='pathos-thumbnail-color-palette-v1';
let activeColorKey='accentColor';
let pendingDeleteColor=null;
function normalizeHex(v){return String(v||'').trim().toUpperCase()}
function sanitizePalette(values){
  const seen=new Set(), out=[];
  for(const raw of Array.isArray(values)?values:[]){
    const color=normalizeHex(raw);
    if(!/^#[0-9A-F]{6}$/.test(color) || seen.has(color)) continue;
    seen.add(color); out.push(color);
  }
  return out;
}
function readPaletteStorage(key){
  try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}
}
function loadColorPalette(){
  const current=readPaletteStorage(COLOR_PALETTE_KEY);
  const legacy=readPaletteStorage(LEGACY_COLOR_PALETTE_KEY);
  const clean=sanitizePalette(current.length?current:legacy);
  try{
    localStorage.setItem(COLOR_PALETTE_KEY,JSON.stringify(clean));
    localStorage.removeItem(LEGACY_COLOR_PALETTE_KEY);
  }catch{}
  return clean;
}
let savedColors=loadColorPalette();
function saveColorPalette(){
  savedColors=sanitizePalette(savedColors);
  try{localStorage.setItem(COLOR_PALETTE_KEY,JSON.stringify(savedColors))}catch{}
}
function setActiveColorKey(key){
  activeColorKey=key;
  $$('.color-accordion').forEach(el=>el.classList.toggle('active-color',el.dataset.colorGroup===key));
}
function activateColorAccordion(key,forceOpen=true){
  const group=$(`[data-color-group="${key}"]`);if(!group)return;
  $$('.color-accordion').forEach(g=>{if(g!==group)g.classList.remove('open')});
  if(forceOpen)group.classList.add('open');
  const host=group.querySelector('.inline-picker-host'),picker=$('#inlineColorPicker');
  if(host&&picker&&picker.parentElement!==host)host.appendChild(picker);
  setActiveColorKey(key);syncColorPickerUI();
}
function addSavedColor(rawColor){
  const color=normalizeHex(rawColor);
  if(!/^#[0-9A-F]{6}$/.test(color)) return false;
  savedColors=sanitizePalette(savedColors);
  if(savedColors.includes(color)){
    saveColorPalette(); renderColorPalette(); toast('同じ色は追加できません'); return false;
  }
  savedColors.push(color); saveColorPalette(); renderColorPalette(); toast('カラーを追加しました'); return true;
}
function renderColorPalette(){
  const list=$('#colorPaletteList'); if(!list)return;
  savedColors=sanitizePalette(savedColors); saveColorPalette(); list.innerHTML='';
  const xsvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  savedColors.forEach(color=>{
    const item=document.createElement('div'); item.className='palette-item'; item.dataset.color=color;
    const sw=document.createElement('button'); sw.type='button'; sw.className='palette-swatch'; sw.dataset.applyColor=color; sw.style.background=color; sw.setAttribute('aria-label',color+'を適用');
    const del=document.createElement('button'); del.type='button'; del.className='palette-delete'; del.dataset.deleteColor=color; del.setAttribute('aria-label',color+'を削除'); del.innerHTML=xsvg;
    item.append(sw,del); list.appendChild(item);
  });
  const empty=$('#pickerPaletteEmpty');if(empty)empty.hidden=savedColors.length>0;
}
function openDeleteColorModal(color){
  const normalized=normalizeHex(color); if(!savedColors.includes(normalized))return;
  pendingDeleteColor=normalized; const value=$('#deleteColorValue'); if(value)value.textContent=normalized; $('#deleteColorModal')?.classList.remove('hidden');
}
function closeDeleteColorModal(){pendingDeleteColor=null;$('#deleteColorModal')?.classList.add('hidden')}
function deletePendingColor(){
  if(!pendingDeleteColor)return false;
  const target=normalizeHex(pendingDeleteColor); const before=savedColors.length;
  savedColors=sanitizePalette(savedColors).filter(color=>color!==target); saveColorPalette(); renderColorPalette(); closeDeleteColorModal();
  if(savedColors.length<before){toast('カラーを削除しました');return true} return false;
}

let colorInteractionSnap=null;
let pickerHSV={h:0,s:1,v:1};
function hexToRgb(hex){const c=normalizeHex(hex).replace('#','');return {r:parseInt(c.slice(0,2),16),g:parseInt(c.slice(2,4),16),b:parseInt(c.slice(4,6),16)}}
function rgbToHex(r,g,b){const h=n=>Number(n).toString(16).padStart(2,'0').toUpperCase();return '#'+h(clamp(0,Number(r)||0,255))+h(clamp(0,Number(g)||0,255))+h(clamp(0,Number(b)||0,255))}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;if(d){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return {h,s:max===0?0:d/max,v:max}}
function hsvToRgb(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}return {r:Math.round((r+m)*255),g:Math.round((g+m)*255),b:Math.round((b+m)*255)}}
function hueColor(h){const rgb=hsvToRgb((h+360)%360,1,1);return rgbToHex(rgb.r,rgb.g,rgb.b)}
function syncColorPickerUI(){const color=normalizeHex(state[activeColorKey]||'#ABED00');const meta={frameColor:'外枠',panelColor:'メインエリア',textColor:'テキスト',accentColor:'強調'};const prev=$('#pickerPreview');if(prev)prev.style.background=color;const hex=$('#pickerHex');if(hex&&document.activeElement!==hex)hex.value=color;const name=$('#pickerTargetName');if(name)name.textContent=meta[activeColorKey]||'カラー';const rgb=hexToRgb(color);pickerHSV=rgbToHsv(rgb.r,rgb.g,rgb.b);[['R',rgb.r],['G',rgb.g],['B',rgb.b]].forEach(([k,val])=>{const r=$('#picker'+k),n=$('#picker'+k+'Num');if(r)r.value=val;if(n&&document.activeElement!==n)n.value=val});const sv=$('#pickerSV'),svt=$('#pickerSVThumb'),hue=$('#pickerHueThumb');if(sv)sv.style.setProperty('--picker-hue',hueColor(pickerHSV.h));if(svt){svt.style.left=(pickerHSV.s*100)+'%';svt.style.top=((1-pickerHSV.v)*100)+'%'}if(hue)hue.style.top=(pickerHSV.h/360*100)+'%';const empty=$('#pickerPaletteEmpty');if(empty)empty.hidden=savedColors.length>0}
function applyPickerColor(color){color=normalizeHex(color);if(!/^#[0-9A-F]{6}$/.test(color))return;state[activeColorKey]=color;syncControls();reflow();syncColorPickerUI()}
function applyHSV(h,s,v){pickerHSV={h:(h+360)%360,s:clamp(0,s,1),v:clamp(0,v,1)};const rgb=hsvToRgb(pickerHSV.h,pickerHSV.s,pickerHSV.v);applyPickerColor(rgbToHex(rgb.r,rgb.g,rgb.b))}
function beginColorInteraction(){if(!colorInteractionSnap)colorInteractionSnap=snapshotState()}
function endColorInteraction(){if(colorInteractionSnap&&!sameState(colorInteractionSnap,state))pushHistory(colorInteractionSnap);colorInteractionSnap=null}
function bindPointerPlane(el,handler){let active=false;const move=e=>{if(!active)return;handler(e)};el.addEventListener('pointerdown',e=>{active=true;beginColorInteraction();el.setPointerCapture?.(e.pointerId);handler(e)});el.addEventListener('pointermove',move);el.addEventListener('pointerup',e=>{active=false;el.releasePointerCapture?.(e.pointerId);endColorInteraction()});el.addEventListener('pointercancel',()=>{active=false;endColorInteraction()})}

const snapshotState=()=>JSON.parse(JSON.stringify(state));
function sameState(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function updateHistoryButtons(){
  ['undoBtn','undoMobileBtn'].forEach(id=>{const el=$('#'+id);if(el)el.disabled=historyStack.length===0});
  ['redoBtn','redoMobileBtn'].forEach(id=>{const el=$('#'+id);if(el)el.disabled=redoStack.length===0});
}
function pushHistory(snapshot){
  if(historyLock||!snapshot)return;
  const last=historyStack[historyStack.length-1];
  if(last&&sameState(last,snapshot))return;
  historyStack.push(snapshot);if(historyStack.length>50)historyStack.shift();redoStack=[];updateHistoryButtons();
}
function restoreSnapshot(snapshot){
  historyLock=true;state={...defaults,...JSON.parse(JSON.stringify(snapshot))};syncControls();reflow();historyLock=false;updateHistoryButtons();
}
function undo(){if(!historyStack.length)return;redoStack.push(snapshotState());restoreSnapshot(historyStack.pop())}
function redo(){if(!redoStack.length)return;historyStack.push(snapshotState());restoreSnapshot(redoStack.pop())}

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clamp=(min,v,max)=>Math.max(min,Math.min(max,v));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function deriveMetrics(titleSize, subtitleSize){
  return {
    underlineGap:Math.round(clamp(10,titleSize*.17,22)),
    underlineHeight:Math.round(clamp(5,titleSize*.0975,12)),
    titleSubtitleGap:Math.round(clamp(28,(titleSize+subtitleSize)*.323,62)),
    pointGap:Math.round(clamp(24,titleSize*.39,52)),
    pointHeight:Math.round(clamp(58,state.pointSize*1.9,96)),
    pointSize:state.pointSize,
    pointPadX:Math.round(clamp(26,state.pointSize*1.08,58)),
    titleLineGap:Math.round(clamp(2,titleSize*.07,10)),
    subtitleLineGap:Math.round(clamp(2,subtitleSize*.08,8))
  };
}
function lines(text){ const a=String(text||'').split(/\r?\n/); return a.length?a:['']; }
function renderLogo(){
  const zone=$('#logoZone'), wrap=$('#logoWrap');
  zone.hidden=!state.logoVisible;
  wrap.style.width=state.logoWidth+'px'; wrap.style.color=state.textColor;
  if(!state.logoVisible){ wrap.innerHTML=''; updateOpticalLayout(); return; }
  if(state.logoKind==='custom'&&state.logoData){wrap.innerHTML=`<img alt="logo" src="${state.logoData}">`;}
  else {wrap.innerHTML=DEFAULT_LOGO_SVG; const poly=wrap.querySelector('polygon[fill="#ABED00"]'); if(poly) poly.setAttribute('fill',state.accentColor);}
  requestAnimationFrame(updateOpticalLayout);
}
function updateOpticalLayout(){
  const safe=$('#stageSafe'), wrap=$('#logoWrap');
  const logoH=state.logoVisible ? (wrap.offsetHeight||0) : 0;
  const reserve=state.logoVisible ? Math.max(0,logoH + 32) : 0;
  safe.style.setProperty('--logo-reserve',reserve+'px');
}
function renderTextLines(){
  $('#titleLines').innerHTML=lines(state.title).map(x=>`<span class="title-line"><span class="title-text">${esc(x)||'&nbsp;'}</span><span class="title-underline"></span></span>`).join('');
  $('#subtitleLines').innerHTML=lines(state.subtitle).map(x=>`<span class="subtitle-line"><span class="subtitle-text">${esc(x)||'&nbsp;'}</span></span>`).join('');
  $('#pointText').textContent=state.pointText; const pointEl=$('#pointLabel'); pointEl.hidden=!state.pointVisible; pointEl.dataset.style=state.pointStyle;
}
function applyVisualState(){
  const stage=$('#stage'); stage.style.background=state.frameColor; stage.style.color=state.textColor;
  $('#bgSquare').style.background=state.panelColor; $('#bgSquare').style.borderRadius='32px'; $('#bgSquare').hidden=state.background!=='square';
  $('#bgCircleFill').style.background=state.panelColor; $('#bgCircleOutline').style.borderColor=state.panelColor; $('#bgCircleOutline').style.borderWidth='8px';
  $('#bgCircleFill').hidden=state.background!=='circle'; $('#bgCircleOutline').hidden=state.background!=='circle';
  $('.title-lines').style.color=state.textColor; $('.subtitle-lines').style.color=state.textColor;
  document.documentElement.style.setProperty('--ui-accent',state.accentColor);
  $$('.title-underline').forEach(el=>{el.style.background=state.accentColor;el.hidden=!state.underlineVisible});
  const point=$('#pointLabel'); point.style.background=state.accentColor; point.style.color=state.textColor; point.style.setProperty('--point-radius',state.pointRadius+'px'); point.dataset.style=state.pointStyle;
  renderLogo();
}
function setMetricVars(m){
  const root=$('#stage');
  root.style.setProperty('--underline-gap',m.underlineGap+'px');root.style.setProperty('--underline-height',m.underlineHeight+'px');root.style.setProperty('--title-subtitle-gap',m.titleSubtitleGap+'px');root.style.setProperty('--point-gap',m.pointGap+'px');root.style.setProperty('--point-height',m.pointHeight+'px');root.style.setProperty('--point-size',m.pointSize+'px');root.style.setProperty('--point-pad-x',m.pointPadX+'px');root.style.setProperty('--title-line-gap',m.titleLineGap+'px');root.style.setProperty('--subtitle-line-gap',m.subtitleLineGap+'px');
  $$('.title-underline').forEach(el=>{el.style.background=state.accentColor;el.hidden=!state.underlineVisible});
}
function setFontSizes(t,s){ $('.title-lines').style.fontSize=t+'px'; $('.subtitle-lines').style.fontSize=s+'px'; }
function isOverflowing(){
  const titleOverflow=$$('.title-text').some(el=>el.scrollWidth>$('#copyWrap').clientWidth+1);
  const subOverflow=$$('.subtitle-text').some(el=>el.scrollWidth>$('#copyWrap').clientWidth+1);
  return {overflow:titleOverflow||subOverflow,titleOverflow,subOverflow,vertical:false};
}
function reflow(){
  renderTextLines(); applyVisualState(); updateOpticalLayout();
  let t=state.titleSize, s=state.subtitleSize; setMetricVars(deriveMetrics(t,s)); setFontSizes(t,s);
  let check=isOverflowing(), loops=0;
  // Internal horizontal overflow guard: requested size is honored unless a line exceeds the fixed content width.
  // Logo size and vertical layout never change the requested font size.
  while(check.overflow && loops<120 && (t>48||s>28)){
    if(check.titleOverflow && t>48)t-=1;
    if(check.subOverflow && s>28)s-=1;
    if(check.vertical){ if(t>48)t-=1; if(s>28)s-=1; }
    setMetricVars(deriveMetrics(t,s)); setFontSizes(t,s); updateOpticalLayout(); check=isOverflowing(); loops++;
  }
  lastFit={title:t,subtitle:s,status:check.overflow?'error':(t<state.titleSize||s<state.subtitleSize?'clamped':'ok')};
  renderLogo(); updateOpticalLayout();
}
function resizeStage(){
  const vp=$('#stageViewport'), stage=$('#stage'); if(!vp||!stage)return;
  const w=vp.clientWidth; if(!w)return;
  const fitScale=w/1600;
  vp.style.height=(w*9/16)+'px';
  const effectiveZoom=innerWidth<900?1:previewZoom;
  const scale=fitScale*effectiveZoom;
  stage.style.width='1600px'; stage.style.height='900px';
  stage.style.left='50%'; stage.style.top='50%';
  stage.style.transformOrigin='50% 50%'; stage.style.transform=`translate(-50%,-50%) scale(${scale})`;
  $('#zoomValue').textContent=Math.round((innerWidth<900?1:previewZoom)*100)+'%';
}
function syncControls(){
  const map=[['titleInput','title'],['subtitleInput','subtitle'],['pointInput','pointText']];
  map.forEach(([id,k])=>{const el=$('#'+id);if(el&&document.activeElement!==el)el.value=state[k]});
  const nums=[['titleSize',state.titleSize],['subtitleSize',state.subtitleSize],['pointSize',state.pointSize],['pointRadius',state.pointRadius],['logoSize',state.logoWidth]];
  nums.forEach(([id,v])=>{const el=$('#'+id),num=$('#'+id+'Num');if(el)el.value=v;if(num&&document.activeElement!==num)num.value=v});
  [['frameColor','frameColor'],['panelColor','panelColor'],['textColor','textColor'],['accentColor','accentColor']].forEach(([id,k])=>{const txt=$('#'+id+'Text'),sw=$('#'+id+'Swatch');if(sw)sw.style.background=state[k];if(txt)txt.textContent=state[k].toUpperCase()}); if($('#inlineColorPicker'))syncColorPickerUI();
  setSwitch('#pointSwitch',state.pointVisible);setSwitch('#underlineSwitch',state.underlineVisible);setSwitch('#logoSwitch',state.logoVisible);
  $$('[data-bg]').forEach(b=>b.classList.toggle('active',b.dataset.bg===state.background));
  $$('[data-point-style]').forEach(b=>b.classList.toggle('active',b.dataset.pointStyle===state.pointStyle));
  const pr=$('#pointRadiusField');if(pr)pr.hidden=state.pointStyle==='bracket';
  $$('[data-step-key]').forEach(btn=>{const k=btn.dataset.stepKey;const input=btn.parentElement?.querySelector('input[type="range"]');if(!input)return;const v=Number(state[k]),min=Number(input.min),max=Number(input.max);btn.disabled=Number(btn.dataset.stepDir)<0?v<=min:v>=max});
  setActiveColorKey(activeColorKey);
  updateHistoryButtons();
}
function setSwitch(sel,on){const el=$(sel);el.classList.toggle('on',!!on);el.setAttribute('aria-pressed',String(!!on));}
function bindRange(id,key,min,max){
  const r=$('#'+id),n=$('#'+id+'Num');let startSnap=null;
  const begin=()=>{if(!startSnap)startSnap=snapshotState()};
  const update=v=>{state[key]=clamp(min,Number(v)||min,max);syncControls();reflow()};
  const end=()=>{if(startSnap&&!sameState(startSnap,state))pushHistory(startSnap);startSnap=null};
  r.addEventListener('pointerdown',begin);r.addEventListener('input',e=>update(e.target.value));r.addEventListener('change',end);r.addEventListener('pointerup',end);
  n.addEventListener('focus',begin);n.addEventListener('change',e=>{update(e.target.value);end()});
}
function stepByEight(key,direction){const btn=$(`[data-step-key="${key}"][data-step-dir="${direction}"]`);const input=btn?.parentElement?.querySelector('input[type="range"]');if(!input)return;const min=Number(input.min),max=Number(input.max),current=Number(state[key]);let next;if(direction>0)next=(Math.floor(current/8)+1)*8;else next=(Math.ceil(current/8)-1)*8;next=clamp(min,next,max);if(next===current)return;const before=snapshotState();state[key]=next;syncControls();reflow();pushHistory(before)}

function mobileStickyHeight(){return innerWidth<900 ? ($('#editorLeft')?.getBoundingClientRect().height||0) : 0}
function updateStickyMetrics(){document.documentElement.style.setProperty('--mobile-sticky-h',Math.ceil(mobileStickyHeight())+'px')}
function switchTab(name){
  $$('.phase-tab,.mobile-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  $$('.tab-panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===name));
  if(innerWidth<900){
    requestAnimationFrame(()=>{
      updateStickyMetrics();
      const right=$('.editor-right'); if(!right)return;
      const sticky=mobileStickyHeight(); const rect=right.getBoundingClientRect();
      if(rect.top<sticky-2 || rect.top>sticky+40){
        window.scrollTo({top:Math.max(0,window.scrollY+rect.top-sticky-8),behavior:'smooth'});
      }
    });
  }
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}
function resetAll(){
  const before=snapshotState();state={...defaults};previewZoom=1;syncControls();reflow();resizeStage();
  if(!sameState(before,state))pushHistory(before);toast('初期値に戻しました');
}
function stageUnits(rect){const sr=$('#stage').getBoundingClientRect();const sc=sr.width/1600;return{x:(rect.left-sr.left)/sc,y:(rect.top-sr.top)/sc,w:rect.width/sc,h:rect.height/sc,scale:sc}}
function svgTextCenters(selector,fontSize,weight,letterSpacing,color){return $$(selector).map(el=>{const r=stageUnits(el.getBoundingClientRect());const text=esc(el.textContent.replace(/\u00a0/g,' '));return `<text x="${(r.x+r.w/2).toFixed(2)}" y="${(r.y+r.h/2).toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans JP,Noto Sans CJK JP,Hiragino Sans,Yu Gothic,sans-serif" font-size="${fontSize}" font-weight="${weight}" letter-spacing="${letterSpacing}em" fill="${color}">${text}</text>`}).join('')}
function logoDataForExport(){if(state.logoKind==='custom'&&state.logoData)return state.logoData;const colored=DEFAULT_LOGO_SVG.replaceAll('#ABED00',state.accentColor).replace('<svg ','<svg style="color:'+state.textColor+'" ');return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(colored)}
function buildExportSvg(){
  const bg=state.background==='square'?`<rect x="72" y="72" width="1456" height="756" rx="32" fill="${state.panelColor}"/>`:`<circle cx="800" cy="450" r="820" fill="none" stroke="${state.panelColor}" stroke-width="8"/><circle cx="800" cy="450" r="770" fill="${state.panelColor}"/>`;
  const under=state.underlineVisible?$$('.title-underline').map(el=>{const r=stageUnits(el.getBoundingClientRect());return `<rect x="${r.x.toFixed(2)}" y="${r.y.toFixed(2)}" width="${r.w.toFixed(2)}" height="${r.h.toFixed(2)}" fill="${state.accentColor}"/>`}).join(''):'';
  let point=''; if(state.pointVisible){const r=stageUnits($('#pointLabel').getBoundingClientRect());const bgc=state.accentColor;const radius=Math.min(state.pointRadius,r.h/2);const cx=(r.x+r.w/2).toFixed(2),cy=(r.y+r.h/2).toFixed(2);const textAttrs=`x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans JP,Noto Sans CJK JP,Hiragino Sans,Yu Gothic,sans-serif" font-size="${state.pointSize}" font-weight="800" letter-spacing=".04em" fill="${state.textColor}"`;if(state.pointStyle==='bracket'){point=`<text ${textAttrs}>【${esc(state.pointText)}】</text>`;}else{const tail=state.pointStyle==='speech'?`<path d="M ${(r.x+r.w*.20).toFixed(2)} ${(r.y+r.h-1).toFixed(2)} L ${(r.x+r.w*.20+28).toFixed(2)} ${(r.y+r.h-1).toFixed(2)} L ${(r.x+r.w*.20).toFixed(2)} ${(r.y+r.h+22).toFixed(2)} Z" fill="${bgc}"/>`:'';point=`<g><rect x="${r.x.toFixed(2)}" y="${r.y.toFixed(2)}" width="${r.w.toFixed(2)}" height="${r.h.toFixed(2)}" rx="${radius.toFixed(2)}" fill="${bgc}"/>${tail}<text ${textAttrs}>${esc(state.pointText)}</text></g>`;}}
  let logo=''; if(state.logoVisible){const logoR=stageUnits($('#logoWrap').getBoundingClientRect());logo=`<image href="${logoDataForExport()}" x="${logoR.x.toFixed(2)}" y="${logoR.y.toFixed(2)}" width="${logoR.w.toFixed(2)}" height="${logoR.h.toFixed(2)}" preserveAspectRatio="xMidYMid meet"/>`;}
  return `<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="${state.frameColor}"/>${bg}${under}${svgTextCenters('.title-text',lastFit.title,700,.018,state.textColor)}${svgTextCenters('.subtitle-text',lastFit.subtitle,600,.028,state.textColor)}${point}${logo}</svg>`;
}
function exportFilename(){
  const pad=n=>String(n).padStart(2,'0');
  const d=new Date();
  const stamp=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  let base=String(state.title||'').trim().replace(/\r?\n/g,'_').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,' ').replace(/_+/g,'_').trim();
  if(!base)base='PATHOS_thumbnail';
  if(base.length>80)base=base.slice(0,80).trim();
  return `${base}_${stamp}.png`;
}
async function exportPng(){
  try{await document.fonts.ready;reflow();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const svg=buildExportSvg();const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});const c=document.createElement('canvas');c.width=1600;c.height=900;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,1600,900);URL.revokeObjectURL(url);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=exportFilename();a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png');toast('PNGを書き出しました')}catch(e){console.error(e);toast('書き出しに失敗しました')}
}

// Events
$$('.phase-tab,.mobile-tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
$$('.tuning-head').forEach(h=>{if(h.dataset.colorAccordionKey)return;h.addEventListener('click',()=>h.parentElement.classList.toggle('open'))});
$$('[data-color-accordion-key]').forEach(h=>h.addEventListener('click',()=>{const key=h.dataset.colorAccordionKey,group=h.closest('.color-accordion'),wasOpen=group.classList.contains('open');if(wasOpen){group.classList.remove('open')}else{activateColorAccordion(key,true)}}));

function bindTextHistory(id,key){
  const el=$('#'+id);let startSnap=null;
  el.addEventListener('focus',()=>{startSnap=snapshotState()});
  el.addEventListener('input',e=>{state[key]=e.target.value;reflow()});
  el.addEventListener('blur',()=>{if(startSnap&&!sameState(startSnap,state))pushHistory(startSnap);startSnap=null});
}
bindTextHistory('titleInput','title');bindTextHistory('subtitleInput','subtitle');bindTextHistory('pointInput','pointText');
bindRange('titleSize','titleSize',48,128);bindRange('subtitleSize','subtitleSize',24,80);bindRange('pointSize','pointSize',24,56);bindRange('pointRadius','pointRadius',0,48);bindRange('logoSize','logoWidth',112,320);
$$('[data-step-key]').forEach(btn=>btn.addEventListener('click',()=>stepByEight(btn.dataset.stepKey,Number(btn.dataset.stepDir))));
function toggleState(key){const before=snapshotState();state[key]=!state[key];syncControls();reflow();pushHistory(before)}
$('#pointSwitch').addEventListener('click',()=>toggleState('pointVisible'));
$('#underlineSwitch').addEventListener('click',()=>toggleState('underlineVisible'));
$('#logoSwitch').addEventListener('click',()=>toggleState('logoVisible'));
$$('[data-point-style]').forEach(b=>b.addEventListener('click',()=>{if(state.pointStyle===b.dataset.pointStyle)return;const before=snapshotState();state.pointStyle=b.dataset.pointStyle;syncControls();reflow();pushHistory(before)}));
$$('[data-bg]').forEach(b=>b.addEventListener('click',()=>{if(state.background===b.dataset.bg)return;const before=snapshotState();state.background=b.dataset.bg;syncControls();reflow();pushHistory(before)}));
activateColorAccordion('frameColor',true);
let hexStartSnap=null;$('#pickerHex').addEventListener('focus',()=>{hexStartSnap=snapshotState()});$('#pickerHex').addEventListener('input',e=>{let v=e.target.value.trim().toUpperCase();if(v&&!v.startsWith('#'))v='#'+v;e.target.value=v;if(/^#[0-9A-F]{6}$/.test(v))applyPickerColor(v)});$('#pickerHex').addEventListener('blur',()=>{if(hexStartSnap&&!sameState(hexStartSnap,state))pushHistory(hexStartSnap);hexStartSnap=null});
[['R','r'],['G','g'],['B','b']].forEach(([id,key])=>{const range=$('#picker'+id),num=$('#picker'+id+'Num');let snap=null;const begin=()=>{if(!snap)snap=snapshotState()};const update=v=>{const rgb=hexToRgb(state[activeColorKey]||'#ABED00');rgb[key]=clamp(0,Number(v)||0,255);applyPickerColor(rgbToHex(rgb.r,rgb.g,rgb.b))};const end=()=>{if(snap&&!sameState(snap,state))pushHistory(snap);snap=null};range.addEventListener('pointerdown',begin);range.addEventListener('input',e=>update(e.target.value));range.addEventListener('change',end);range.addEventListener('pointerup',end);num.addEventListener('focus',begin);num.addEventListener('input',e=>update(e.target.value));num.addEventListener('change',end);num.addEventListener('blur',end)});
$('#colorPaletteAdd').addEventListener('click',()=>{addSavedColor(state[activeColorKey]||'#ABED00')});
$$('[data-color-picker-close]').forEach(el=>el.addEventListener('click',closeColorPicker));
bindPointerPlane($('#pickerSV'),e=>{const r=$('#pickerSV').getBoundingClientRect();const s=clamp(0,(e.clientX-r.left)/r.width,1);const v=1-clamp(0,(e.clientY-r.top)/r.height,1);applyHSV(pickerHSV.h,s,v)});
bindPointerPlane($('#pickerHue'),e=>{const r=$('#pickerHue').getBoundingClientRect();const h=clamp(0,(e.clientY-r.top)/r.height,1)*360;applyHSV(h,pickerHSV.s,pickerHSV.v)});
$('#colorPaletteList').addEventListener('pointerdown',e=>{if(e.target.closest('[data-delete-color]'))e.stopPropagation()});
$('#colorPaletteList').addEventListener('click',e=>{const deleteBtn=e.target.closest('[data-delete-color]');if(deleteBtn){e.preventDefault();e.stopPropagation();openDeleteColorModal(deleteBtn.dataset.deleteColor);return;}const swatch=e.target.closest('[data-apply-color]');if(swatch){const color=normalizeHex(swatch.dataset.applyColor);const before=snapshotState();state[activeColorKey]=color;syncControls();reflow();if(!sameState(before,state))pushHistory(before)}});
$$('[data-color-modal-close]').forEach(el=>el.addEventListener('click',closeDeleteColorModal));
$('#deleteColorConfirm').addEventListener('click',deletePendingColor);
$('#logoInput').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const before=snapshotState();const reader=new FileReader();reader.onload=()=>{state.logoKind='custom';state.logoData=reader.result;renderLogo();reflow();pushHistory(before);toast('ロゴを差し替えました')};reader.readAsDataURL(f)});
$('#logoResetBtn').addEventListener('click',()=>{if(state.logoKind==='default'&&!state.logoData)return;const before=snapshotState();state.logoKind='default';state.logoData=null;renderLogo();reflow();pushHistory(before)});
$('#zoomOutBtn').addEventListener('click',()=>{previewZoom=clamp(.6,previewZoom-.1,1.4);resizeStage()});$('#zoomInBtn').addEventListener('click',()=>{previewZoom=clamp(.6,previewZoom+.1,1.4);resizeStage()});
$('#resetBtn').addEventListener('click',resetAll);$('#resetPanelBtn').addEventListener('click',resetAll);$('#exportBtn').addEventListener('click',exportPng);$('#exportTopBtn').addEventListener('click',exportPng);$('#exportMobileBtn').addEventListener('click',exportPng);
$('#copySettingsBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(JSON.stringify(state,null,2));toast('設定JSONをコピーしました')}catch{toast('コピーできませんでした')}});
['undoBtn','undoMobileBtn'].forEach(id=>$('#'+id)?.addEventListener('click',undo));
['redoBtn','redoMobileBtn'].forEach(id=>$('#'+id)?.addEventListener('click',redo));
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}});
const resetHandlers={titleSize:()=>state.titleSize=defaults.titleSize,subtitleSize:()=>state.subtitleSize=defaults.subtitleSize,pointSize:()=>state.pointSize=defaults.pointSize,pointRadius:()=>state.pointRadius=defaults.pointRadius,logoWidth:()=>state.logoWidth=defaults.logoWidth};
$$('[data-reset]').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const fn=resetHandlers[btn.dataset.reset];if(!fn)return;const before=snapshotState();fn();syncControls();reflow();if(!sameState(before,state))pushHistory(before)}));

window.addEventListener('resize',()=>{resizeStage();reflow();updateStickyMetrics()});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{resizeStage();updateStickyMetrics()});
window.addEventListener('pageshow',()=>{if(innerWidth<900)previewZoom=1;reflow();resizeStage();updateStickyMetrics()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(innerWidth<900)previewZoom=1;requestAnimationFrame(()=>{reflow();resizeStage();updateStickyMetrics()})}});
function initApp(){
  renderColorPalette();activateColorAccordion(activeColorKey||'frameColor',true);syncControls();reflow();resizeStage();updateStickyMetrics();updateHistoryButtons();
  requestAnimationFrame(()=>{reflow();resizeStage();updateStickyMetrics()});
  if('ResizeObserver' in window){
    const stageResizeObserver=new ResizeObserver(()=>{resizeStage();updateStickyMetrics()});stageResizeObserver.observe($('#stageViewport'));
    const stickyResizeObserver=new ResizeObserver(updateStickyMetrics);stickyResizeObserver.observe($('#editorLeft'));
  }
}
try{initApp()}catch(err){console.error('PATHOS Thumbnail Studio init error',err);try{resizeStage()}catch(_){}}
</script>
